version: '3.8'

services:
  # ML Service for crop recommendations
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: crop-ml-service
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
      - ./data:/app/data  # Mount your CSV dataset here
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - crop-network
    restart: unless-stopped

  # Backend API (existing FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crop-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/cropdb
      - ML_SERVICE_URL=http://ml-service:8001
    depends_on:
      - ml-service
    networks:
      - crop-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_ML_SERVICE_URL=http://localhost:8001
    depends_on:
      - backend
      - ml-service
    networks:
      - crop-network
    restart: unless-stopped

networks:
  crop-network:
    driver: bridge
