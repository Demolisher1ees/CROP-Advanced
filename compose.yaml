version: '3.8'

services:
  # ML Service for crop recommendations
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: crop-ml-service
    ports:
      - "8001:8001"
    volumes:
      - ./ml-service:/app
      - ./data:/app/data  # Mount your CSV dataset here
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - crop-network
    restart: unless-stopped

  # Database service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: crop-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-cropuser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-croppass}
      - POSTGRES_DB=${POSTGRES_DB:-crop_advisor}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - crop-network
    restart: unless-stopped

  # Redis caching service used by backend
  redis:
    image: redis:7-alpine
    container_name: crop-redis
    ports:
      - "6379:6379"
    networks:
      - crop-network
    restart: unless-stopped

  # Backend API (existing FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crop-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-db:/app/db  # Persist SQLite database (fallback)
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - DATABASE_URL=${DATABASE_URL:-postgresql://cropuser:croppass@db:5432/crop_advisor}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - ML_SERVICE_URL=${ML_SERVICE_URL:-http://ml-service:8001}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - ml-service
      - db
    networks:
      - crop-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crop-frontend
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ML_SERVICE_URL=${NEXT_PUBLIC_ML_SERVICE_URL:-http://localhost:8001}
      - API_URL=${API_URL:-http://backend:8000}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3001}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - backend
      - ml-service
    networks:
      - crop-network
    restart: unless-stopped

networks:
  crop-network:
    driver: bridge

volumes:
  postgres-data:
  backend-db:  # Named volume for SQLite database persistence
